name: Sync Calendar Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ICLOUD_ICS_URL: ${{ secrets.ICLOUD_ICS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ICS feed
        run: |
          mkdir -p data
          URL="$ICLOUD_ICS_URL"
          if [ -z "$URL" ]; then
            URL="https://p132-caldav.icloud.com/published/2/MTE2NTMwNTkyOTQxMTY1M2IrR2BWe0FSyuyKNNGlCHQLtmZXk5FRGOOabVbBZz2y7fUDNBL3Cptuyi9F9A03j8q4IjNMYhTojLlvKY36i-I"
          fi
          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            -A "Mozilla/5.0" \
            "$URL" \
            -o data/calendar.ics

      - name: Validate ICS
        run: |
          grep -q "BEGIN:VCALENDAR" data/calendar.ics
          grep -q "BEGIN:VEVENT" data/calendar.ics

      - name: Commit changes
        run: |
          if git diff --quiet -- data/calendar.ics; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.ics
          git commit -m "chore: sync calendar feed"
          git push
