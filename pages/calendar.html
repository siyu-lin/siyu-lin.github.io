<!-- FullCalendar global bundle (includes dayGrid/timeGrid/list/etc) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/main.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>

<!-- ICAL.js -->
<script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>

<style>
  #calendar { max-width: 1100px; margin: 20px auto; }
  #cal-status { max-width: 1100px; margin: 10px auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #event-details {
    max-width: 1100px;
    margin: 12px auto 0;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    display: none;
  }
  #event-details h3 { margin: 0 0 8px; }
  #event-details p { margin: 6px 0; white-space: pre-wrap; }
</style>

<div id="cal-status">Loading calendar…</div>
<div id="calendar"></div>
<div id="event-details"></div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const statusEl = document.getElementById('cal-status');
  const calendarEl = document.getElementById('calendar');
  const detailsEl = document.getElementById('event-details');
  const refreshMs = 5 * 60 * 1000;
  const escapeHtml = (value) =>
    String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");

  const icsDataUrl = "{{ '/data/calendar.ics' | relative_url }}";
  const liveIcsUrl = "https://p132-caldav.icloud.com/published/2/MTE2NTMwNTkyOTQxMTY1M2IrR2BWe0FSyuyKNNGlCHQLtmZXk5FRGOOabVbBZz2y7fUDNBL3Cptuyi9F9A03j8q4IjNMYhTojLlvKY36i-I";
  let calendar = null;

  const parseEventsFromIcs = (icsText) => {
    const jcalData = ICAL.parse(icsText);
    const comp = new ICAL.Component(jcalData);
    const vevents = comp.getAllSubcomponents("vevent");
    return vevents.map(v => {
      const e = new ICAL.Event(v);
      return {
        title: e.summary || "(no title)",
        start: e.startDate.toJSDate(),
        end: e.endDate ? e.endDate.toJSDate() : null,
        allDay: e.startDate.isDate,
        extendedProps: {
          description: e.description || "",
          location: e.location || ""
        }
      };
    });
  };

  async function fetchFirstValidIcs(sources) {
    const errors = [];
    for (const source of sources) {
      try {
        const res = await fetch(source.url, { cache: "no-store" });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        const text = await res.text();
        if (!text.includes("BEGIN:VCALENDAR")) throw new Error("invalid ICS response");
        return { text, label: source.label };
      } catch (err) {
        errors.push(`${source.label}: ${err.message}`);
      }
    }
    throw new Error(`All fetch attempts failed. ${errors.join(" | ")}`);
  }

  async function loadCalendar() {
    try {
      statusEl.textContent = "Fetching calendar data…";

      const nonce = Date.now();
      const syncedUrl = `${icsDataUrl}?_=${nonce}`;
      const fetchStart = performance.now();
      let icsInfo = await fetchFirstValidIcs([{ label: "synced feed", url: syncedUrl }]);

      const fetchMs = Math.round(performance.now() - fetchStart);
      statusEl.textContent = "Parsing events…";
      let events = parseEventsFromIcs(icsInfo.text);

      if (events.length === 0) {
        const liveUrl = `${liveIcsUrl}?_=${nonce}`;
        const liveSources = [
          { label: "iCloud live", url: liveUrl },
          { label: "corsproxy.io", url: `https://corsproxy.io/?${encodeURIComponent(liveUrl)}` },
          { label: "allorigins.win", url: `https://api.allorigins.win/raw?url=${encodeURIComponent(liveUrl)}` }
        ];
        try {
          const liveInfo = await fetchFirstValidIcs(liveSources);
          const liveEvents = parseEventsFromIcs(liveInfo.text);
          if (liveEvents.length > 0) {
            events = liveEvents;
            icsInfo = liveInfo;
          }
        } catch (_) {
          // Keep using synced feed result if live fallbacks are blocked.
        }
      }

      if (!calendar) {
        calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: "dayGridMonth",
          headerToolbar: {
            left: "prev,next today",
            center: "title",
            right: "dayGridMonth,timeGridWeek,listWeek"
          },
          buttonText: {
            dayGridMonth: "Month",
            timeGridWeek: "Week",
            listWeek: "Agenda"
          },
          nowIndicator: true,
          navLinks: true,
          eventClick: ({ event }) => {
            const startText = event.start
              ? event.start.toLocaleString()
              : "N/A";
            const endText = event.end
              ? event.end.toLocaleString()
              : "N/A";
            const location = event.extendedProps.location || "N/A";
            const description = event.extendedProps.description || "No description.";

            detailsEl.style.display = "block";
            detailsEl.innerHTML = `
              <h3>${escapeHtml(event.title)}</h3>
              <p><strong>Starts:</strong> ${escapeHtml(startText)}</p>
              <p><strong>Ends:</strong> ${escapeHtml(endText)}</p>
              <p><strong>Location:</strong> ${escapeHtml(location)}</p>
              <p><strong>Description:</strong> ${escapeHtml(description)}</p>
            `;
          },
          height: "auto",
          events
        });
        calendar.render();
      } else {
        calendar.removeAllEvents();
        calendar.addEventSource(events);
      }

      const refreshMins = Math.round(refreshMs / 60000);
      if (events.length === 0) {
        statusEl.textContent = `Loaded 0 events from ${icsInfo.label}. Sync may be stale; check GitHub Actions 'Sync Calendar Feed'.`;
      } else {
        statusEl.textContent = `Loaded ${events.length} events from ${icsInfo.label} (fetch: ${fetchMs} ms, refresh every ${refreshMins} min).`;
      }
    } catch (err) {
      console.error(err);
      statusEl.textContent = `Calendar failed to load: ${err.message}`;
    }
  }

  await loadCalendar();
  setInterval(loadCalendar, refreshMs);
});
</script>
